const cases = [

오르막 18%
내리막 12%
1 5'08" 5'08" 162 163
2 5'13" 5'13" 165 162
3 5'08" 5'08" 168 163`,
    expect: {
      distanceKm: 8.15, durationSec: 2500, avgHr: 168, hrMax: 184,
      cadence: 164, calories: 606, strideCm: 119, gctMs: 251, ascentM: 72
    },
    splits: 3
  },
  {
    name: 'Amazfit 공유카드 (05\'48"은 시간, 05\'10"이 평균페이스)',
    text: `야외 달리기
hs Jung
8월 15일 17:49
Amazfit Active 3 Premium

05'48"  05'10"  05'12"
29°C 68%`,
    expect: { distanceKm: 1.11, durationSec: [340, 360], avgPaceSec: 310, avgHr: null, calories: null },
    dateDay: 15
  },
  {
    name: '구간 1.00+0.11만 있어도 총거리 1.11',
    text: `8월 15일 17:49
구간별 기록
1.00 km 05'32"
0.11 km 05'49"`,
    expect: { distanceKm: 1.11 },
    dateDay: 15,
    splits: 2
  },
  {
    name: '17:49를 일자 17로 쓰면 안 됨',
    text: `8월 15일 17:49
1.11 km
05'48"  05'10"  05'12"`,
    expect: { distanceKm: 1.11, avgPaceSec: 310 },
    dateDay: 15
  },
  {
    name: 'OCR 월 l5일 → 15일',
    text: `8월 l5일 17:49
1.11 km`,
    expect: { distanceKm: 1.11 },
    dateDay: 15
  },
  {
    name: 'OCR 깨짐 kn/kca1/O6:11/습도',
    text: `8월 15일 17:49
1.l1 kn

케이던스 182 spm
습도 68%`,
    expect: { distanceKm: 1.11, durationSec: [360, 400], calories: 95, avgHr: 139, cadence: 182 }
  },
  {
    name: 'Zepp 경사 5구간 + 심박존',
    text: `거리 10.20 km
운동 시간 52:10

최고 강도 0:12 0%
고강도 8:40 17%
중강도 31:20 60%
저강도 10:20 20%
워밍업 1:38 3%`,
    expect: { distanceKm: 10.2, durationSec: 3130, avgHr: 161, cadence: 170 },
    grade: { steepUp: 4, up: 16, flat: 62, down: 14, steepDown: 4 },
    zones: ['high', 'mid', 'focus', 'warmup']
  },
  {
    name: '인터벌 단계 화면',
    text: `워밍업 16:04.7 3.00 5:22
1 러닝 3:00.0 0.61 4:57
체력 회복 1:00.0 0.18 5:36

체력 회복 1:00.0 0.17 5:40
쿨다운 10:00.0 1.70 5:53`,
    phases: 6
  },
  {
    name: '줄바꿈 라벨 카드 (숫자 다음 줄)',
    text: `야외 달리기

    expect: { distanceKm: 1.11, durationSec: [360, 400], calories: 95, avgHr: 144, hrMax: 157, cadence: 188, cadMax: 201, strideCm: 104 }
  },
  {
    name: 'Amazfit 상세: 05:46.05를 5.46km로 읽으면 안 됨',
    text: `8월 19일 17:44
야외 달리기
1.11 km

05'12"
166 bpm

174 rpm

트레이닝 효과 유산소 2.0

0.11 km 05'09" 176`,
    expect: {
      distanceKm: 1.11, durationSec: [340, 360], avgHr: 166, hrMax: 174,
      cadence: 174, calories: 79, strideCm: 110, gctMs: 265, avgPowerW: 333, vo2max: 55
    },
    splits: 2,
    grade: { flat: 89, up: 10, down: 1 },
    zones: ['peak', 'high', 'mid', 'focus', 'warmup']
  },
  {
    name: 'OCR이 시간을 5.46으로 깨뜨려도 거리가 되면 안 됨',
    text: `1.11 km
05.46.05
05'12"
166 bpm
79 kcal
174 rpm`,
    expect: { distanceKm: 1.11, durationSec: [340, 360], avgHr: 166, cadence: 174, calories: 79 }
  }
];

const wordCases = [
  {
    name: '좌표 파싱: 라벨 아래 평균/최고',
    words: [
      { t:'심박수', x:40, y:100, x1:140, y1:130 },
      { t:'139', x:40, y:140, x1:100, y1:180 },
      { t:'bpm', x:110, y:150, x1:160, y1:175 },
      { t:'153', x:180, y:140, x1:240, y1:180 },
      { t:'케이던스', x:40, y:220, x1:160, y1:250 },
      { t:'182', x:40, y:260, x1:100, y1:300 },
      { t:'spm', x:110, y:270, x1:160, y1:295 },
      { t:'192', x:180, y:260, x1:240, y1:300 },
      { t:'1.11', x:40, y:20, x1:160, y1:80 },
      { t:'km', x:170, y:40, x1:220, y1:70 }
    ],
    expect: { avgHr:139, hrMax:153, cadence:182, cadMax:192, distanceKm:1.11 }
  },
  {
    name: '좌표 파싱: 05.46.05는 거리가 아님',
    words: [
      { t:'1.11', x:40, y:20, x1:180, y1:90 },
      { t:'km', x:190, y:40, x1:240, y1:70 },
      { t:'05.46.05', x:40, y:120, x1:200, y1:160 }
    ],
    expect: { distanceKm: 1.11 }
  },
  {
    name: '좌표 파싱: 1.00과 0.11이면 1.11',
    words: [
      { t:'1.00', x:40, y:200, x1:120, y1:230 },
      { t:'km', x:130, y:205, x1:170, y1:225 },
      { t:'0.11', x:40, y:250, x1:120, y1:280 },
      { t:'km', x:130, y:255, x1:170, y1:275 },
      { t:'1.11', x:40, y:20, x1:180, y1:90 },
      { t:'km', x:190, y:40, x1:240, y1:70 }
    ],
    expect: { distanceKm: 1.11 }
  }
];

function near(v, exp){
  if(Array.isArray(exp)) return v>=exp[0] && v<=exp[1];
  if(exp==null) return v==null;
  if(typeof exp==='number') return Math.abs(v-exp)<0.051;
  return v===exp;
}

const lines = [];
let fail = 0, pass = 0;
for(const c of cases){
  const p = parseTextMetrics(c.text || '');
  const sp = parseSplits(c.text || '');
  const gd = parseGradeDist(c.text || '');
  const ph = parseIntervalPhases(c.text || '');
  const miss = [];
  Object.keys(c.expect || {}).forEach(k=>{
    if(!near(p[k], c.expect[k])) miss.push(`${k}=${p[k]} (원함 ${c.expect[k]})`);
  });
  if(c.name.includes('1.11') && p.distanceKm>=3) miss.push('거리가 3km 이상으로 부풀음');
  if(c.name.includes('17:49') && p.durationSec && p.durationSec>800) miss.push('17:49를 운동시간으로 읽음');
  if(c.splits!=null && sp.length!==c.splits) miss.push(`구간 ${sp.length} (원함 ${c.splits})`);
  if(c.dateDay!=null){
    const iso = parseDateFromText(c.text || '');
    const day = iso ? +iso.slice(8,10) : null;
    if(day!==c.dateDay) miss.push(`일자 ${day} (원함 ${c.dateDay}, iso=${iso})`);
  }
  if(c.grade){
    Object.keys(c.grade).forEach(k=>{
      const got = gd && gd[k] && gd[k].pct;
      if(!near(got, c.grade[k])) miss.push(`경사 ${k}=${got} (원함 ${c.grade[k]})`);
    });
  }
  if(c.zones){
    c.zones.forEach(k=>{
      if(!p.hrZones || !p.hrZones[k]) miss.push(`심박존 ${k} 없음`);
    });
  }
  if(c.phases!=null && ph.length!==c.phases) miss.push(`단계 ${ph.length} (원함 ${c.phases})`);
  const ok = !miss.length;
  if(ok) pass++; else fail++;
  lines.push(`<div class="${ok?'ok':'bad'}"><b>${ok?'PASS':'FAIL'} ${c.name}</b><br>${
    ok? `거리 ${p.distanceKm} · ${p.durationSec}s · ♥${p.avgHr}/${p.hrMax||'-'} · ${p.cadence}spm · ${p.calories}kcal · 구간 ${sp.length} · 단계 ${ph.length} · 경사 ${gd?JSON.stringify(gd):'-'}`
      : miss.join(' · ')
  }<pre>${JSON.stringify({distanceKm:p.distanceKm,durationSec:p.durationSec,avgPaceSec:p.avgPaceSec,bestPaceSec:p.bestPaceSec,avgHr:p.avgHr,hrMax:p.hrMax,cadence:p.cadence,cadMax:p.cadMax,calories:p.calories,strideCm:p.strideCm,gctMs:p.gctMs,flightMs:p.flightMs,flightMaxMs:p.flightMaxMs,vertOscCm:p.vertOscCm,ascentM:p.ascentM,descentM:p.descentM,gradeDist:p.gradeDist,hrZones:p.hrZones,splits:sp.length,phases:ph.length},null,0)}</pre></div>`);
}
for(const c of wordCases){
  const p = parseFromWords(c.words);
  const miss = [];
  Object.keys(c.expect).forEach(k=>{
    if(!near(p[k], c.expect[k])) miss.push(`${k}=${p[k]} (원함 ${c.expect[k]})`);
  });
  const ok = !miss.length;
  if(ok) pass++; else fail++;
  lines.push(`<div class="${ok?'ok':'bad'}"><b>${ok?'PASS':'FAIL'} ${c.name}</b><br>${ok?JSON.stringify(p):miss.join(' · ')}</div>`);
}
document.getElementById('out').innerHTML = `<p>${pass} 통과 / ${fail} 실패</p>`+lines.join('');
window.__OCR_TEST = { pass, fail, total: cases.length + wordCases.length };
</script>
</body></html>
