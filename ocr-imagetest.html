<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><title>이미지 OCR 실기 테스트</title>
<style>

pre{white-space:pre-wrap;font-size:11px;background:#1a1a1a;padding:8px;border-radius:8px}
.card{margin:12px 0;padding:12px;border:1px solid #333;border-radius:10px}
img{max-width:280px;border:1px solid #444;margin:6px 0}

<body>
<h2>이미지 OCR 실기 테스트</h2>

<div id="out"></div>
<script>window.RC_TEST = true;</script>
<script src="app.js?v=34img"></script>
<script>
function near(v, exp){
  if(Array.isArray(exp)) return v>=exp[0] && v<=exp[1];
  if(exp==null) return v==null;
  if(typeof exp==='number') return Math.abs(v-exp)<0.08;
  return v===exp;
}
function drawCard(w, h, bg, draw){
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = bg;
  ctx.fillRect(0,0,w,h);
  ctx.textBaseline = 'top';
  draw(ctx);
  return cv.toDataURL('image/png');
}
function line(ctx, y, size, color, text, x){
  ctx.fillStyle = color;
  ctx.font = `700 ${size}px "Malgun Gothic","Apple SD Gothic Neo",sans-serif`;
  ctx.fillText(text, x||36, y);
}

  {

      line(ctx, 590, 28, '#8ea0b6', '케이던스');

      line(ctx, 920, 28, '#8ea0b6', '비행시간');
      line(ctx, 960, 36, '#e9eef5', '110 ms   116 ms');
      line(ctx, 1030, 28, '#8ea0b6', '구간별 기록');
      line(ctx, 1070, 32, '#e9eef5', "1.00 km  05'32\"");
      line(ctx, 1120, 32, '#e9eef5', "0.11 km  05'49\"");
    })
  },
  {
    name: 'Zepp 8.15km',
    expect: { distanceKm: 8.15, durationSec: 2500, avgHr: 168, cadence: 164, calories: 606 },
    dataUrl: drawCard(720, 1100, '#111823', (ctx)=>{
      line(ctx, 40, 32, '#8ea0b6', '거리');
      line(ctx, 80, 64, '#ffffff', '8.15 km');
      line(ctx, 170, 28, '#8ea0b6', '운동 시간');
      line(ctx, 210, 44, '#e9eef5', '41:40');

      line(ctx, 440, 32, '#ff5d6c', '최고 심박 184');
      line(ctx, 500, 36, '#39d98a', '케이던스 164');
      line(ctx, 550, 32, '#39d98a', '최고 케이던스 178');
      line(ctx, 610, 36, '#ffb03d', '606 kcal');
      line(ctx, 670, 32, '#4aa8ff', '보폭 119 cm');
      line(ctx, 720, 32, '#e9eef5', '지면 접촉 시간 251 ms');
      line(ctx, 770, 32, '#e9eef5', '상승 72 m  하강 69 m');
      line(ctx, 830, 28, '#8ea0b6', '평지 70%  오르막 18%  내리막 12%');
      line(ctx, 890, 28, '#e9eef5', "1  5'08\"  5'08\"  162  163");

    })
  },
  {
    name: 'Amazfit 공유카드',

      line(ctx, 40, 28, '#8ea0b6', '거리');

      line(ctx, 400, 32, '#39d98a', '케이던스 176');
      line(ctx, 450, 32, '#ffb03d', '1320 kcal');
      line(ctx, 510, 32, '#4aa8ff', '보폭 121 cm');
      line(ctx, 560, 32, '#e9eef5', '상승 88 m  하강 91 m');
    })
  }
];

(async ()=>{
  const box = document.getElementById('out');
  const st = document.getElementById('st');
  let pass=0, fail=0;
  try{ await ensureOCR(); }
  catch(e){
    st.textContent = 'OCR 엔진 로드 실패: '+e.message;
    window.__OCR_IMG_TEST = { pass:0, fail:fixtures.length, error:String(e) };
    return;
  }
  for(const f of fixtures){
    st.textContent = '인식 중… '+f.name;
    let text='', p={}, ph=[], miss=[];
    try{
      const extracted = await extractRunFromImage(f.dataUrl);
      text = extracted.text || '';
      p = extracted.p || parseTextMetrics(text);
      ph = parseIntervalPhases(text);
    }catch(e){ miss.push('OCR 예외 '+e.message); }
    Object.keys(f.expect||{}).forEach(k=>{
      if(!near(p[k], f.expect[k])) miss.push(`${k}=${p[k]} (원함 ${f.expect[k]})`);
    });
    if(f.expectPhases!=null && ph.length < f.expectPhases) miss.push(`단계 ${ph.length} (원함 ${f.expectPhases})`);
    const ok = !miss.length;
    if(ok) pass++; else fail++;
    box.insertAdjacentHTML('beforeend', `<div class="card ${ok?'ok':'bad'}">
      <b>${ok?'PASS':'FAIL'} ${f.name}</b><br>
      <img src="${f.dataUrl}" alt="${f.name}">
      <div>${ok? `거리 ${p.distanceKm} · ${p.durationSec}s · ♥${p.avgHr} · ${p.cadence}spm · ${p.calories}kcal`
        : miss.join(' · ')}</div>
      <pre>${(text||'').slice(0,800)}</pre>
    </div>`);
  }
  st.textContent = `${pass} 통과 / ${fail} 실패`;
  window.__OCR_IMG_TEST = { pass, fail, total: fixtures.length };
})();
</script>
</body></html>
